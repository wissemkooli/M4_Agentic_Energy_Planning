# MOCK system-level assumptions used by the M4 simulation and optimization engines.
# None of these values are official Tunisian statistics. Replace them with documented
# values (and set data_status: real) once sources are available.
data_status: mock
dataset_version: mock-assumptions-1.0
currency: "USD (constant 2024)"
parameters:
  discount_rate:
    value: 0.08
    unit: "fraction per year"
    note: "Used for capital annualization (CRF) and NPV discounting to 2024"
  peak_to_average_ratio:
    value: 1.20
    unit: "ratio"
    note: "Peak demand (MW) = highest monthly average demand (MW) x ratio. Proxy because only monthly energy is available"
  default_reserve_margin:
    value: 0.15
    unit: "fraction of peak demand"
    note: "Firm capacity (capacity_credit x installed) must exceed (1 + margin) x peak demand"
  network_loss_factor:
    value: 0.0
    unit: "fraction of demand"
    note: "Supply requirement = demand x (1 + factor). 0 assumes M1 demand already measures required supply; confirm the M1 demand definition with the M1 owner"
  import_cost_usd_per_mwh:
    value: 90.0
    unit: "USD/MWh"
    note: "Illustrative cost of electricity imports through interconnections"
  import_emission_factor_t_per_mwh:
    value: 0.0
    unit: "tCO2/MWh"
    note: "Accounting scope = domestic production emissions. Imported electricity emissions are not attributed to Tunisia"
  default_max_import_share:
    value: 0.10
    unit: "fraction of annual supply"
    note: "Interconnection usage limit"
  gas_import_fraction:
    value: 1.0
    unit: "fraction"
    note: "Share of gas-fired generation counted as externally dependent supply in the energy dependence index (1.0 = conservative upper bound)"
  max_variable_renewable_share_monthly:
    value: 0.55
    unit: "fraction of monthly supply"
    note: "Proxy for intra-day flexibility limits (storage and hourly dispatch are not modelled at monthly resolution)"
  # --- Short-term operational problems (monthly unit commitment, MILP) -- MOCK values ---
  thermal_unit_size_mw:
    value: 250
    unit: "MW per dispatchable (gas) unit"
    note: "Illustrative block size used to count gas units kept in service; installed gas capacity / size = number of units"
  thermal_min_stable_fraction:
    value: 0.40
    unit: "fraction of available unit output"
    note: "A unit kept in service produces at least this share of its available output on average over the month"
  thermal_unit_monthly_fixed_cost_musd:
    value: 0.25
    unit: "MUSD per unit-month in service"
    note: "Illustrative standby, staffing and start-up cost of keeping one gas unit in service for a month"
  operating_reserve_margin:
    value: 0.10
    unit: "fraction of monthly peak demand"
    note: "Firm capacity in service must exceed (1 + margin) x monthly peak demand in operational problems"
  value_of_lost_load_usd_per_mwh:
    value: 3000.0
    unit: "USD/MWh"
    note: "Penalty on unserved energy in operational problems (illustrative value of lost load)"
